# Output settings
save_dir: "results"

# Dataset settings  
dataset:
  name: "microsoft/ms_marco"
  version: "v2.1"
  split: "validation"
  query_type: "NUMERIC"
  max_examples: 2

# Compression settings
compressor:
  model_type: "meta-llama/Llama-3.2-3B"
  lang: "en"
  reduce_ratio: 0.35
  reduce_level: "phrase"

# Generation settings
generation:
  generator_type: "scaledown"
  
  api:
    base_url: "https://api.scaledown.xyz/compress/"
    api_key: "YOUR_API_KEY"
    model: "gemini-2.5-flash"

# Evaluation settings
evaluation:
  metrics: ["bleu", "rouge", "llm_judge"]  # Available: bleu, rouge, llm_judge
  